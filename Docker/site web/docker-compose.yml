services:

  # ── MySQL 8 ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: maison_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      maison_saclay
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PHP 8.2-FPM ────────────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: maison_php
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/backend
      - ./.env:/var/www/.env:ro
    environment:
      DB_HOST:     mysql
      DB_PORT:     3306
      DB_NAME:     maison_saclay
      DB_USER:     ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET:  ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    depends_on:
      mysql:
        condition: service_healthy

  # ── Nginx ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: maison_nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./maison-saclay/dist:/var/www/frontend/dist:ro
      - ./backend/public:/var/www/backend/public:ro
      - ./backend/src:/var/www/backend/src:ro
    depends_on:
      - php

  # ── phpMyAdmin (admin DB) ───────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: maison_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST:     mysql
      PMA_USER:     ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql

volumes:
  mysql_data:
