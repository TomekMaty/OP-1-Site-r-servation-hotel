; ============================================
; FICHIER DE DIALPLAN (EXTENSIONS.CONF)
; Projet OP-1 - Hotel de la Plage
; Version Asterisk 16 avec chan_sip
; ============================================
; Ce fichier definit la logique des appels :
;   - Appel vers la reception (1099)
;   - Declenchement alarme incendie (*99)
;   - Notification arrivee visiteur (*9811XXX)
; ============================================

[general]
static=yes
writeprotect=no

; ============================================
; CONTEXTE PRINCIPAL : hotel
; Tous les telephones IP sont dans ce contexte
; (defini dans sip.conf : context=hotel)
; ============================================
[hotel]

; --------------------------------------------
; APPEL VERS LA RECEPTION
; Le client compose le 1099 depuis sa chambre
; Asterisk fait sonner le telephone de la reception
; Timeout : 30 secondes
; --------------------------------------------
exten => 1099,1,Dial(SIP/1099,30)
 same => n,Hangup()

; --------------------------------------------
; ALARME INCENDIE
; Declenchement en composant le *99
; Fait sonner TOUS les telephones simultanement
; et affiche "Alarme incendie" sur chaque ecran
; --------------------------------------------
exten => *99,1,NoOp(=== ALARME INCENDIE DECLENCHEE ===)
 ; Appel asynchrone vers la reception
 same => n,Originate(SIP/1099,exten,alarme,s,1,async)
 ; Appel asynchrone vers chaque chambre
 same => n,Originate(SIP/1001,exten,alarme,s,1,async)
 same => n,Originate(SIP/1002,exten,alarme,s,1,async)
 same => n,Originate(SIP/1003,exten,alarme,s,1,async)
 same => n,Hangup()

; ============================================
; CONTEXTE ALARME
; Gere ce qui se passe quand un telephone
; repond a l'appel d'alarme incendie :
;   - Repond automatiquement
;   - Affiche le message sur l'ecran du telephone
;   - Attend 10 secondes puis raccroche
; ============================================
[alarme]
exten => s,1,Answer()
 same => n,SendText(Alarme incendie)  ; Message affiche sur l'ecran IP
 same => n,Wait(10)                   ; Maintient l'appel 10 secondes
 same => n,Hangup()

; ============================================
; CONTEXTE HOTEL (suite)
; NOTIFICATION ARRIVEE VISITEUR
; La reception compose *9811XXX
; ex: *9811001 pour prevenir la chambre 1001
; Le telephone de la chambre sonne et affiche
; "Votre contact est arrive"
; ============================================
[hotel]
exten => _*9811XXX,1,NoOp(=== VISITEUR ARRIVE POUR CHAMBRE ${EXTEN:4} ===)
 ; Extrait le numero de chambre (les 4 derniers chiffres)
 ; ex: *9811001 -> 1001
 same => n,Originate(SIP/${EXTEN:4},exten,visiteur,s,1,async)
 same => n,Hangup()

; ============================================
; CONTEXTE VISITEUR
; Gere la notification d'arrivee :
;   - Repond automatiquement
;   - Affiche le message sur l'ecran du telephone
;   - Attend 5 secondes puis raccroche
; ============================================
[visiteur]
exten => s,1,Answer()
 same => n,SendText(Votre contact est arrive)  ; Message affiche sur l'ecran
 same => n,Wait(5)                             ; Maintient l'appel 5 secondes
 same => n,Hangup()
