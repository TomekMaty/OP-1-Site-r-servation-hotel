; ============================================
; FICHIER DE CONFIGURATION PJSIP
; Projet OP-1 - Hotel de la Plage
; ============================================

; ============================================
; GLOBAL
; Force l'identification par username
; ============================================
[global]
type=global
endpoint_identifier_order=username,ip,anonymous

; ============================================
; TRANSPORT UDP
; Asterisk ecoute sur toutes les interfaces
; sur le port 5060 en UDP
; ============================================
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

; ============================================
; TEMPLATES DE BASE
; ============================================

; Template endpoint : parametres communs a tous les telephones
; - rewrite_contact=yes : corrige l'AOR vide envoye par Linphone
[endpoint-basic](!)
type=endpoint
context=hotel
disallow=all
allow=ulaw
allow=alaw
rewrite_contact=yes

; Template auth : authentification par login/mot de passe
[auth-basic](!)
type=auth
auth_type=userpass

; Template aor : 1 seul appareil par extension
[aor-basic](!)
type=aor
max_contacts=1

; ============================================
; RECEPTION - Extension 1099
; ============================================
[1099](endpoint-basic)
auth=auth1099
aors=aor1099
callerid="Reception" <1099>

[auth1099](auth-basic)
username=1099
password=reception123

[aor1099](aor-basic)
contact=sip:1099@192.168.30.200:5060

; ============================================
; CHAMBRE 1001
; ============================================
[1001](endpoint-basic)
auth=auth1001
aors=aor1001
callerid="Chambre 1001" <1001>

[auth1001](auth-basic)
username=1001
password=chambre1001

[aor1001](aor-basic)

