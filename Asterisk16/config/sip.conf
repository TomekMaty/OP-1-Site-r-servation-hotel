; ============================================
; FICHIER DE CONFIGURATION SIP (chan_sip)
; Projet OP-1 - Hotel de la Plage
; ============================================
; Ce fichier definit :
;   - Les parametres generaux SIP
;   - Les comptes SIP de chaque telephone IP
; ============================================

[general]
; --- Parametres reseau ---
bindport=5060                    ; Port d'ecoute SIP
bindaddr=0.0.0.0                 ; Ecoute sur toutes les interfaces
context=hotel                    ; Contexte dialplan par defaut
externip=192.168.30.2            ; IP annoncee dans les SDP (IP physique Debian PC fac)
localnet=192.168.30.0/255.255.255.0 ; Reseau local (pas de NAT pour les phones LAN)

; --- Codecs autorises ---
disallow=all                     ; Desactive tous les codecs
allow=ulaw                       ; Autorise G.711 ulaw
allow=alaw                       ; Autorise G.711 alaw

; --- Securite ---
alwaysauthreject=yes             ; Rejette toujours avec auth (anti-scan)
allowguest=no                    ; Pas d'appels anonymes
directmedia=no                   ; Audio passe toujours par Asterisk (evite problemes RTP direct)

; --- NAT ---
nat=force_rport,comedia          ; Gestion NAT

; ============================================
; RECEPTION - Extension 1099
; Le client compose le 1099 pour joindre
; la reception de l'hotel
; ============================================
[1099]
type=friend                      ; Peut appeler et recevoir des appels
username=1099
secret=1099                      ; Mot de passe du compte SIP reception
host=dynamic                     ; GXV3240 - enregistrement dynamique accepte
port=5060                        ; Port SIP du telephone
context=hotel                    ; Contexte dialplan
callerid="Reception" <1099>      ; Nom affiche sur les telephones
qualify=no                       ; GXV3240 ne repond pas aux OPTIONS - toujours considere disponible
directmedia=no                   ; Media passe par Asterisk (pas de direct RTP)

; ============================================
; CHAMBRE 1001 - 1er etage
; ============================================
[1001]
type=friend                      ; Peut appeler et recevoir des appels
username=1001
secret=chambre1001               ; Mot de passe du compte SIP chambre 1001
host=dynamic	                 ; IP dynamique de la chambre 1001
port=5065                        ; Port SIP de la chambre 1001
context=hotel                    ; Contexte dialplan
callerid="Chambre 1001" <1001>   ; Nom affiche lors d'un appel sortant
qualify=no                       ; GXV3240 ne repond pas aux OPTIONS - toujours considere disponible

