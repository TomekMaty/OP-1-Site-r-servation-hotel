# ============================================================
# clients.conf — FreeRADIUS — Maison Saclay
# Définit qui peut envoyer des requêtes RADIUS à ce serveur
# Secret unifié : Azerty1234. (même valeur configurée dans l'EAP)
# ============================================================

# ---- Borne WiFi EAP330 (NAS) — IP physique LAN ----
client borne-wifi-eap330 {
    ipaddr      = 192.168.30.253
    secret      = Azerty1234.
    shortname   = eap330-wifi
    nastype     = other
    require_message_authenticator = no
}

# ---- Debian PC fac (IP LAN 192.168.30.2) — hôte Docker Linux ----
client debian-pc-fac {
    ipaddr      = 192.168.30.2
    secret      = Azerty1234.
    shortname   = debian-pc-fac
    nastype     = other
    require_message_authenticator = no
}

# ---- Docker bridge gateway (172.19.0.1) ----
client docker-bridge-eap {
    ipaddr      = 172.19.0.1
    secret      = Azerty1234.
    shortname   = eap-proxy-bridge
    nastype     = other
    require_message_authenticator = no
}

# ---- Tous les containers Docker (172.x.x.x) — relay socat + portail ----
client docker-containers {
    ipaddr      = 172.0.0.0/8
    secret      = Azerty1234.
    shortname   = docker-all
    nastype     = other
    require_message_authenticator = no
}

# ---- Fallback toutes IPs (pour tests futurs) ----
client fallback-all {
    ipaddr      = 0.0.0.0/0
    secret      = Azerty1234.
    shortname   = fallback
    nastype     = other
    require_message_authenticator = no
}
